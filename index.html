:root{

:root[data-theme="dark"]{
  --bg:#17181c; --surface:#212228; --ink:#f1ece8; --muted:#a69d97; --line:#34353d;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:18px 14px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--lantern);font-weight:700}
h1{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.3;margin:2px 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 13px;font:inherit;font-size:14px;cursor:pointer;line-height:1.3;text-align:center}
.tab small{display:block;font-size:10px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--lantern);border-color:var(--lantern);color:#fff}
.tab[aria-selected="true"] small{color:#ffe3dc}

main .wrap{padding-block:18px 48px;display:grid;gap:22px}
h2{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.35;margin:0;text-wrap:balance}
h3{font-size:13px;letter-spacing:.1em;color:var(--muted);margin:0 0 8px;font-weight:700}
p{margin:0}
.note{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.dayhead{display:grid;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border-radius:6px;padding:2px 8px;background:var(--jade-soft);color:var(--jade);font-weight:700}
.chip.red{background:var(--lantern-soft);color:var(--lantern)}
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}

.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.alt{background:var(--lantern-soft);border-radius:10px;padding:10px 12px;font-size:14px}
ol.tl{list-style:none;margin:0;padding:0;display:grid}

.t{font-variant-numeric:tabular-nums;font-weight:700;color:var(--lantern);font-size:13.5px;line-height:1.5}
.what{min-width:0}
.how{display:block;color:var(--muted);font-size:13px}
.food{display:grid;gap:10px}
.food .row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline}
.food .name{font-weight:700}
.food .price{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700;font-size:13px;white-space:nowrap}
.food .desc{grid-column:1/-1;color:var(--muted);font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--jade);background:var(--jade-soft);color:var(--jade);border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent}
ul.plain{margin:0;padding-left:1.2em;display:grid;gap:4px}
.cards{display:grid;gap:10px}
.dcard{display:grid;grid-template-columns:3.2em 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;color:inherit;cursor:pointer}
.dcard .d{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1;text-align:center}
.dcard .d small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);font-weight:500}
.dcard .ttl{font-weight:700}
.dcard .meta{font-size:12px;color:var(--muted)}
.dcard .ret{font-variant-numeric:tabular-nums;font-size:12px;color:var(--jade);font-weight:700;white-space:nowrap}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}

tr.total td{font-weight:700;border-bottom:0}
a{color:var(--jade)}
.links{display:grid;gap:6px;font-size:13.5px}

function tabs(){

function renderDay(d){

  let body="";
  if(m==="normal"||!hasModes){
    body=`<ol class="tl">${d.modes.normal.map(([t,w,h])=>`<li><span class="t">${t}</span><span class="what">${esc(w)}${h?`<span class="how">${esc(h)}</span>`:""}</span></li>`).join("")}</ol>`;
  }else{
    const alt=d.modes[m];
    body=`<div class="alt">${esc(alt.note)}</div>`;
    if(alt.taxi) body+=`<div style="margin-top:10px">${taxiBtns([alt.taxi])}</div>`;
    body+=`<p class="note" style="margin-top:10px">通常の時間割は「通常」で確認できます。</p>`;
  }
  return `<section class="dayhead"><div class="eyebrow">${esc(d.date)}</div><h2>${esc(d.title)}</h2>
   <div class="chips"><span class="chip red">${d.id==="d10"?"":"帰着 "}${esc(d.ret)}</span>${d.chips.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div>
   <p class="note">${esc(d.lead)}</p></section>
  ${hasModes?`<div class="seg" role="group" aria-label="プラン切り替え">${MODES.map(([k,l])=>`<button data-mode="${k}" data-day="${d.id}" aria-pressed="${m===k}">${l}</button>`).join("")}</div>`:""}
  <section class="panel"><h3>時間割</h3>${body}${d.mrt&&m==="normal"?`<p class="note" style="margin-top:8px">${esc(d.mrt)}</p>`:""}</section>

  <section class="panel"><h3>食べたいもの</h3><div class="food">${d.food.map(([n,p,x])=>`<div class="row"><span class="name">${esc(n)}</span><span class="price">${esc(p)}</span><span class="desc">${esc(x)}</span></div>`).join("")}</div>

}

  return `<section class="dayhead"><h2>交通・予算・評価</h2><p class="note">3〜4人なら、乗換がある区間はタクシーの方が楽で、割り勘すれば1人NT$50〜80ほどです。</p></section>

}

function render(){
  tabs();
  const v=$("#view");
  if(state.view==="top") v.innerHTML=renderTop();
  else if(state.view==="info") v.innerHTML=renderInfo();
  else v.innerHTML=renderDay(DAYS.find(d=>d.id===state.view));
}

function go(id,push=true){
  state.view=id; render(); window.scrollTo(0,0);
  if(push){ try{ history.replaceState(null,"","#"+id) }catch(e){ location.hash=id } }
}

function taipeiToday(){
  const s=new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Taipei"});
  const map={"2026-11-06":"d6","2026-11-07":"d7","2026-11-08":"d8","2026-11-09":"d9","2026-11-10":"d10"};
  return map[s];
}

document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){go(g.dataset.go);return}
  const m=e.target.closest("[data-mode]"); if(m){state.mode[m.dataset.day]=m.dataset.mode;render();return}
  const t=e.target.closest("[data-taxi]"); if(t){
    const p=t.dataset.taxi==="hotel"?HOTEL:P[t.dataset.taxi];
    $("#tx-place").textContent=p.zh; $("#tx-addr").textContent=p.addr; $("#tx-ja").textContent=p.ja;
    $("#taxi").hidden=false; $("#tx-close").focus(); return}
});
$("#tx-close").addEventListener("click",()=>{$("#taxi").hidden=true});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#taxi").hidden=true});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&h!==state.view&&(h==="top"||h==="info"||DAYS.some(d=>d.id===h)))go(h,false)});

const h=location.hash.slice(1);
const valid=id=>id==="top"||id==="info"||DAYS.some(d=>d.id===id);
go(valid(h)?h:(taipeiToday()||"top"),false);
</script>
